name: aeris_expense
description: >
  AERIS Expense — Android-first expense tracker that auto-reads bank/UPI SMS,
  stores transactions in Firestore, renders charts via Syncfusion, and
  surfaces on-device statistical predictions + cut-down recommendations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  # Crash + error reports from real devices (ColorOS background kills etc.)
  firebase_crashlytics: ^5.4.0

  # ── State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── SMS + permissions (Android only)
  another_telephony: ^0.4.1
  permission_handler: ^11.3.0

  # ── UI utilities
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  # Request the panel's highest refresh rate (90/120Hz) on Android — Flutter
  # otherwise renders at 60Hz on many devices, which makes scrolling feel slow.
  flutter_displaymode: ^0.6.0
  intl: ^0.19.0
  uuid: ^4.3.3

  # ── Local cache (offline-first while Firestore syncs)
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # ── Networking + utils
  http: ^1.2.1
  collection: ^1.18.0
  rxdart: ^0.27.7

  # ── Notifications
  flutter_local_notifications: ^17.0.0

  cupertino_icons: ^1.0.6
  syncfusion_flutter_charts: ^33.2.8
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.1
  confetti: ^0.8.0
  flutter_timezone: ^5.1.0
  home_widget: ^0.9.2
  syncfusion_flutter_xlsio: ^33.2.8
  share_plus: ">=10.0.3 <11.0.0"   # same Share.share/shareXFiles API
  syncfusion_officechart: ^33.2.8

  # ── Profile picture (pick from gallery/camera; bytes are encrypted in Firestore)
  image_picker: ^1.1.2

  # ── Biometric / device-credential app lock
  local_auth: ^2.3.0

  # ── Bank statement import (PDF / CSV / Excel → transactions)
  file_picker: ^8.1.2   # 8.x API; was pinned to 8.0.7 only while Firebase 2.x blocked web ^1.0
  csv: ^6.0.0
  syncfusion_flutter_pdf: ^33.2.8
  # XLSX is read via archive (zip) + xml — avoids the `excel` package's
  # archive ^3 pin which conflicts with syncfusion_officechart's archive ^4.
  archive: ^4.0.0
  xml: ^6.5.0

  # ── Receipt scan: on-device OCR (no network, text never leaves the phone)
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#15C0B4"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    # Plus Jakarta Sans, bundled so the app never downloads fonts at runtime
    # (google_fonts finds these by file name; see main.dart).
    - assets/google_fonts/

  # The same files registered as ONE family with real weights, so a plain
  # `TextStyle(fontWeight: FontWeight.w800)` picks the actual ExtraBold face.
  # (google_fonts registers each weight as its own family — anything that
  # only changed the weight fell back to a synthetic, smeared bold.)
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/google_fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/google_fonts/PlusJakartaSans-Italic.ttf
          style: italic
        - asset: assets/google_fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/google_fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
